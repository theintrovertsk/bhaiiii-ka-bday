<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telegram Custom Web</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1621; --sidebar:#17212b; --header:#17212b; --bubble-out:#2b5278;
  --bubble-in:#182533; --accent:#5288c1; --accent2:#64b5f6; --text:#e8eaed;
  --muted:#7d8e9e; --dim:#4a5a6a; --border:#1f2f3f; --hover:#202d3a;
  --active:#2b3f52; --danger:#e05c65; --green:#4dbe93; --r:12px;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none}
.scr{display:none;height:100vh;width:100vw;position:fixed;top:0;left:0}
.scr.on{display:flex}

/* LOGIN */
#s-login{align-items:center;justify-content:center;background:radial-gradient(ellipse at 60% 20%,#1b3049 0%,#0e1621 65%);flex-direction:column;}
.lbox{background:var(--sidebar);border:1px solid var(--border);border-radius:20px;padding:40px 44px;width:420px;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lbox .tg-logo{display:flex;align-items:center;gap:14px;margin-bottom:32px;}
.tg-logo-icon{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#5288c1,#3a6fa0);display:flex;align-items:center;justify-content:center;}
.tg-logo-icon svg{width:26px;height:26px}
.tg-logo span{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.lstep{display:none;animation:fadeIn .2s ease}
.lstep.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lstep h2{font-size:20px;font-weight:700;margin-bottom:6px}
.lstep .sub{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px;margin-bottom:6px}
.finput{width:100%;background:#0e1621;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--text);font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;margin-bottom:14px;}
.finput:focus{border-color:var(--accent)}
.finput::placeholder{color:var(--dim)}
.phone-wrap{display:flex;gap:8px;margin-bottom:14px}
.pcode{width:70px;text-align:center;padding:12px 6px;margin-bottom:0}
.pnum{flex:1;margin-bottom:0}
.pbtn{width:100%;padding:13px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:10px;}
.pbtn:hover{background:#5e96d4}
.pbtn:disabled{opacity:.5;cursor:not-allowed}
.otp-row{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.obox{width:44px;height:54px;text-align:center;background:#0e1621;border:1.5px solid var(--border);border-radius:10px;font-size:20px;font-weight:700;color:var(--text);font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;caret-color:var(--accent);}
.obox:focus{border-color:var(--accent)}
.backbtn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:20px;display:inline-flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;}
.backbtn:hover{color:var(--text)}
.errmsg{font-size:13px;color:var(--danger);margin-top:10px;min-height:18px}
.info-msg{font-size:12px;color:var(--accent2);margin-bottom:14px;padding:10px;background:rgba(100,181,246,.1);border-radius:8px;border-left:3px solid var(--accent2);line-height:1.5}

.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .65s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

/* APP */
#s-app{flex-direction:row}
.sidebar{width:360px;min-width:360px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;transition:transform .25s ease;}
.sh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);}
.ham{width:38px;height:38px;border-radius:50%;background:none;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.ham:hover{background:var(--hover);color:var(--text)}
.sch-wrap{flex:1;position:relative}
.sch{width:100%;background:#0e1621;border:1px solid var(--border);border-radius:22px;padding:9px 14px 9px 38px;font-size:14px;color:var(--text);font-family:'Inter',sans-serif;outline:none;}
.sch:focus{border-color:var(--accent)}
.sch::placeholder{color:var(--dim)}
.sch-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);}
.clist{flex:1;overflow-y:auto}
.clist::-webkit-scrollbar{width:3px}
.clist::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ci{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;position:relative;transition:background .12s;}
.ci:hover{background:var(--hover)}
.ci.act{background:var(--active)}
.ci-av{width:54px;height:54px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;overflow:hidden;}
.ci-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ci-info{flex:1;min-width:0}
.ci-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.ci-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.ci-time{font-size:12px;color:var(--muted);flex-shrink:0;margin-left:6px}
.ci-bot{display:flex;align-items:center;justify-content:space-between}
.ci-prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0;margin-left:6px;}

.me-panel{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.me-av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
.me-info{flex:1;min-width:0}
.me-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-phone{font-size:12px;color:var(--muted)}
.iconbtn{background:none;border:none;color:var(--dim);cursor:pointer;padding:6px;border-radius:8px;transition:color .15s,background .15s;display:flex;align-items:center;justify-content:center;}
.iconbtn:hover{color:var(--danger);background:rgba(224,92,101,.1)}

.cpanel{flex:1;display:flex;flex-direction:column;height:100vh;background:var(--bg);position:relative;}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);}
.empty-state svg{opacity:.15;margin-bottom:18px}
.empty-state p{font-size:16px}

.chat-hdr{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--header);flex-shrink:0;}
.chdr-av{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;overflow:hidden;}
.chdr-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.chdr-info{flex:1}
.chdr-name{font-size:16px;font-weight:600}
.chdr-status{font-size:12px;color:var(--accent2)}
.hdr-btn{width:38px;height:38px;border-radius:50%;background:none;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.hdr-btn:hover{background:var(--hover);color:var(--text)}

.msgs{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:1px;background:var(--bg);}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.date-sep{text-align:center;margin:14px 0 10px}
.date-sep span{background:rgba(23,33,43,.85);color:var(--muted);padding:5px 14px;border-radius:14px;font-size:12px;backdrop-filter:blur(4px);}
.mw{display:flex;margin-bottom:1px;align-items:flex-end;gap:6px}
.mw.out{justify-content:flex-end}
.mw.in{justify-content:flex-start}
.m-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;align-self:flex-end;}
.mbub{max-width:62%;padding:7px 11px 5px;word-break:break-word;line-height:1.5;position:relative;}
.mw.out .mbub{background:var(--bubble-out);border-radius:16px 16px 4px 16px;}
.mw.in .mbub{background:var(--bubble-in);border-radius:16px 16px 16px 4px;}
.mtxt{font-size:14.5px}
.mmeta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:1px;float:right;margin-left:8px;}
.mtime{font-size:11px;color:rgba(255,255,255,.45)}
.mcheck{font-size:10px;color:var(--accent2)}

.svc{text-align:center;font-size:12.5px;color:var(--muted);margin:10px auto;padding:5px 16px;background:rgba(23,33,43,.7);border-radius:14px;max-width:80%;backdrop-filter:blur(4px);align-self:center;}

.inp-area{display:flex;align-items:flex-end;gap:10px;padding:10px 20px 14px;background:var(--header);border-top:1px solid var(--border);flex-shrink:0;}
.itxt{flex:1;background:#0e1621;border:1px solid var(--border);border-radius:22px;padding:11px 16px;font-size:14.5px;color:var(--text);font-family:'Inter',sans-serif;outline:none;resize:none;max-height:160px;overflow-y:auto;line-height:1.5;transition:border-color .2s;}
.itxt:focus{border-color:var(--accent)}
.itxt::placeholder{color:var(--dim)}
.sbtn{width:46px;height:46px;border-radius:50%;background:var(--accent);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .1s;flex-shrink:0;}
.sbtn:hover{background:#5e96d4}
.sbtn:active{transform:scale(.92)}

.sk-chat{display:flex;align-items:center;gap:12px;padding:10px 16px;}
.sk-av{width:54px;height:54px;border-radius:50%;background:var(--hover)}
.sk-lines{flex:1}
.sk-line{height:12px;border-radius:6px;background:var(--hover);margin-bottom:8px}
.sk-line.short{width:40%}

#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#2b3f52;color:var(--text);padding:11px 22px;border-radius:12px;font-size:14px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 4px 20px rgba(0,0,0,.4);white-space:nowrap;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.av0{background:#5b8dd9} .av1{background:#c05b8d} .av2{background:#5bba8d}
.av3{background:#d9933a} .av4{background:#8b5bd9} .av5{background:#3abbd9}
.av6{background:#d95b5b} .av7{background:#5b9fd9} .av8{background:#9bb05b}
.av9{background:#8b5b3a}

@media(max-width:720px){
  .sidebar{position:fixed;z-index:100;width:100vw;min-width:0;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .back-mob{display:flex!important}
}
.back-mob{display:none;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;align-items:center;justify-content:center;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="s-login" class="scr on">
  <div class="lbox">
    <div class="tg-logo">
      <div class="tg-logo-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M22 2 11 13" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M22 2 15 22 11 13 2 9l20-7z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
      <span>Telegram</span>
    </div>

    <!-- phone -->
    <div class="lstep on" id="st-phone">
      <h2>Apna number daalo</h2>
      <p class="sub">Country code aur phone number daalo</p>
      <div class="lbl">Phone Number</div>
      <div class="phone-wrap">
        <input class="finput pcode" id="p-code" value="+91" maxlength="5">
        <input class="finput pnum" id="p-num" type="tel" placeholder="9876543210">
      </div>
      <button class="pbtn" id="btn-phone">
        <span id="btn-phone-txt">Aage →</span>
      </button>
      <div class="errmsg" id="e-phone"></div>
    </div>

    <!-- otp -->
    <div class="lstep" id="st-otp">
      <button class="backbtn" id="back-phone">← Wapas</button>
      <h2>Code Daalo</h2>
      <p class="sub" id="otp-sub">Telegram app ke "Telegram" service chat mein code aaya hai</p>
      <div class="otp-row">
        <input class="obox" maxlength="1" type="tel">
        <input class="obox" maxlength="1" type="tel">
        <input class="obox" maxlength="1" type="tel">
        <input class="obox" maxlength="1" type="tel">
        <input class="obox" maxlength="1" type="tel">
      </div>
      <button class="pbtn" id="btn-otp">
        <span id="btn-otp-txt">Verify Karein</span>
      </button>
      <div class="errmsg" id="e-otp"></div>
    </div>

    <!-- 2fa -->
    <div class="lstep" id="st-2fa">
      <button class="backbtn" id="back-otp">← Wapas</button>
      <h2>Cloud Password</h2>
      <p class="sub">2-step verification password daalo</p>
      <div class="lbl">Password</div>
      <input class="finput" id="p-2fa" type="password" placeholder="••••••••">
      <button class="pbtn" id="btn-2fa">
        <span id="btn-2fa-txt">Login Karein</span>
      </button>
      <div class="errmsg" id="e-2fa"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="s-app" class="scr">
  <div class="sidebar" id="sidebar">
    <div class="sh">
      <button class="ham" id="ham-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="sch-wrap">
        <svg class="sch-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input class="sch" id="sch" placeholder="Search">
      </div>
    </div>
    <div class="clist" id="clist">
      <div class="sk-chat"><div class="sk-av"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
      <div class="sk-chat"><div class="sk-av"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
      <div class="sk-chat"><div class="sk-av"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
      <div class="sk-chat"><div class="sk-av"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
    </div>
    <div class="me-panel" id="me-panel">
      <div class="me-av av0" id="me-av">?</div>
      <div class="me-info">
        <div class="me-name" id="me-name">...</div>
        <div class="me-phone" id="me-phone">...</div>
      </div>
      <button class="iconbtn" id="logout-btn" title="Logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="cpanel">
    <div class="empty-state" id="empty-state">
      <svg width="90" height="90" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
      </svg>
      <p>Koi bhi chat select karein</p>
    </div>

    <div id="chat-view" style="display:none;flex-direction:column;height:100%">
      <div class="chat-hdr">
        <button class="back-mob" id="back-mob">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <div class="chdr-av av0" id="chdr-av">?</div>
        <div class="chdr-info">
          <div class="chdr-name" id="chdr-name">Chat</div>
          <div class="chdr-status" id="chdr-status">online</div>
        </div>
        <button class="hdr-btn" id="refresh-chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
        </button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="inp-area">
        <textarea class="itxt" id="itxt" placeholder="Message..." rows="1"></textarea>
        <button class="sbtn" id="sbtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════
const API_ID   = 36215209;
const API_HASH = 'cb3db246b091ce2504d21b7f3b59cd77';

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let TG = null;
let client = null;
let me = null;
let dialogs = [];
let activeDialog = null;
let lastMsgId = 0;
let msgPoll = null;
let dlgPoll = null;

// ══════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════
function $id(id){ return document.getElementById(id) }
function h(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function avNum(id){ return 'av'+(Math.abs(Number(BigInt(id||0n)%10n))) }
function initials(name){ return (name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?' }
function ts2time(ts){
  if(!ts)return '';
  const d=new Date(ts*1000),n=new Date();
  if(d.toDateString()===n.toDateString())
    return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const diff=n-d;
  if(diff<604800000)return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  return d.toLocaleDateString([],{day:'2-digit',month:'2-digit',year:'2-digit'});
}
function ts2date(ts){
  const d=new Date(ts*1000),n=new Date();
  const diff=n-d;
  if(d.toDateString()===n.toDateString())return 'Aaj';
  const y=new Date(n); y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString())return 'Kal';
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
}
function toast(msg,dur=3000){
  const t=$id('toast');
  t.textContent=msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),dur);
}
function err(id,msg){$id(id).textContent=msg}
function clrErr(id){$id(id).textContent=''}
function saveSession(s){ try{localStorage.setItem('tgw_s',s)}catch{} }
function loadSession(){ try{return localStorage.getItem('tgw_s')||''}catch{return''} }
function clearSession(){ try{localStorage.removeItem('tgw_s')}catch{} }
function btnLoad(id,on,txt){
  const b=$id(id), t=$id(id+'-txt');
  if(on){b.disabled=true; t.innerHTML=txt+' <span class="spin"></span>'}
  else{b.disabled=false; t.textContent=txt}
}

// ══════════════════════════════════════════
//  OTP INPUTS
// ══════════════════════════════════════════
document.querySelectorAll('.obox').forEach((inp,i,all)=>{
  inp.addEventListener('input',e=>{
    const v=e.target.value.replace(/\D/g,'');
    e.target.value=v[0]||'';
    if(v&&i<all.length-1)all[i+1].focus();
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Backspace'&&!e.target.value&&i>0)all[i-1].focus();
    if(e.key==='Enter')$id('btn-otp').click();
  });
});

// ══════════════════════════════════════════
//  LOAD GRAMJS
// ══════════════════════════════════════════
function loadGramJS(cb){
  if(window.telegram){ TG=window.telegram; cb(); return; }
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/telegram@2.26.22/browser/bin/index.js';
  s.onload=()=>{ TG=window.telegram; cb(); };
  s.onerror=()=>toast('GramJS load failed — network check karo');
  document.head.appendChild(s);
}

function mkClient(sessStr=''){
  const store=new TG.sessions.StringSession(sessStr);
  return new TG.TelegramClient(store,API_ID,API_HASH,{
    connectionRetries:5,
    useWSS:true,
    deviceModel:'Custom Web',
    systemVersion:'1.0',
    appVersion:'1.0',
    langCode:'en',
  });
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
loadGramJS(async()=>{
  const sess=loadSession();
  if(sess){
    try{
      client=mkClient(sess);
      await client.connect();
      if(await client.isUserAuthorized()){
        await bootApp(); return;
      }
    }catch(e){ console.warn('auto-login fail',e); }
  }
  showScr('s-login');
});

function showScr(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  $id(id).classList.add('on');
}
function showStep(id){
  document.querySelectorAll('.lstep').forEach(s=>s.classList.remove('on'));
  $id(id).classList.add('on');
}

// ══════════════════════════════════════════
//  AUTH FLOW
// ══════════════════════════════════════════
$id('btn-phone').addEventListener('click',async()=>{
  const phone = $id('p-code').value.trim() + $id('p-num').value.trim();
  clrErr('e-phone');
  if(!phone || phone.length < 8){err('e-phone','Sahi number daalo'); return}

  btnLoad('btn-phone',true,'Bheja ja raha hai');
  if(!client){ client=mkClient(); await client.connect(); }

  try{
    const res = await client.sendCode({apiId:API_ID, apiHash:API_HASH}, phone);
    console.log("sendCode response:", res);
    
    // In-app ya SMS check
    const codeType = res.type?.className || res.type?.type || 'unknown';
    console.log("Code type:", codeType);
    
    if (codeType.includes('App')) {
      $id('otp-sub').textContent = 'Code tumhare OFFICIAL Telegram app ke "Telegram" service chat mein aaya hai. Wahan se copy karo.';
    } else if (codeType.includes('Sms') || codeType.includes('Call')) {
      $id('otp-sub').textContent = 'Code SMS/Call se aa raha hai. Phone check karo.';
    } else if (codeType.includes('Fragment')) {
      $id('otp-sub').textContent = 'Telegram ne Fragment via code bheja hai.';
    } else {
      $id('otp-sub').textContent = 'Code bheja gaya. Official Telegram app ke "Telegram" chat mein dekho.';
    }

    // Store phone hash for later
    window._phoneHash = res.phoneCodeHash;
    window._phone = phone;
    
    showStep('st-otp');
    document.querySelector('.obox').focus();
  }catch(e){
    console.error("sendCode error:", e);
    if (e.errorMessage === 'PHONE_NUMBER_FLOOD' || (e.message || '').includes('FLOOD')) {
      err('e-phone', 'Bahut attempts ho gaye. 2-3 ghante wait karo.');
    } else if (e.errorMessage === 'PHONE_NUMBER_INVALID') {
      err('e-phone', 'Number galat hai. Format check karo.');
    } else if (e.errorMessage === 'API_ID_INVALID') {
      err('e-phone', 'API ID invalid. my.telegram.org se naya banao.');
    } else {
      err('e-phone', e.message || 'Code nahi gaya. Console check karo.');
    }
  }
  btnLoad('btn-phone',false,'Aage →');
});

// OTP verify
$id('btn-otp').addEventListener('click',async()=>{
  const code=[...document.querySelectorAll('.obox')].map(x=>x.value).join('');
  clrErr('e-otp');
  if(code.length<5){err('e-otp','Poora 5 digit code daalo'); return}

  btnLoad('btn-otp',true,'Verify ho raha hai');
  try{
    await client.invoke(new TG.Api.auth.SignIn({
      phoneNumber: window._phone,
      phoneCodeHash: window._phoneHash,
      phoneCode: code
    }));
    saveSession(client.session.save());
    await bootApp();
  }catch(e){
    console.error("SignIn error:", e);
    if(e.errorMessage==='SESSION_PASSWORD_NEEDED'){
      showStep('st-2fa');
      $id('p-2fa').focus();
    }else if(e.errorMessage==='PHONE_CODE_INVALID'){
      err('e-otp','Code galat hai. Dobara daalo.');
    }else if(e.errorMessage==='PHONE_CODE_EXPIRED'){
      err('e-otp','Code expire ho gaya. Wapas jao aur naya code lo.');
    }else{
      err('e-otp',e.message||'Verify fail');
    }
  }
  btnLoad('btn-otp',false,'Verify Karein');
});

// 2FA
$id('btn-2fa').addEventListener('click',async()=>{
  const pwd=$id('p-2fa').value;
  clrErr('e-2fa');
  if(!pwd){err('e-2fa','Password daalo'); return}

  btnLoad('btn-2fa',true,'Login ho raha hai');
  try{
    const pwdInfo = await client.invoke(new TG.Api.account.GetPassword());
    const { computeCheck } = TG.Password || {};
    if (computeCheck) {
      const chk = await computeCheck(pwdInfo, pwd);
      await client.invoke(new TG.Api.auth.CheckPassword({password: chk}));
    } else {
      await client._handleIfTwoFactorRequired(pwd);
    }
    saveSession(client.session.save());
    await bootApp();
  }catch(e){
    console.error("2FA error:", e);
    err('e-2fa', e.message || 'Galat password');
  }
  btnLoad('btn-2fa',false,'Login Karein');
});

$id('back-phone').addEventListener('click',()=>showStep('st-phone'));
$id('back-otp').addEventListener('click',()=>showStep('st-otp'));

// ══════════════════════════════════════════
//  BOOT APP
// ══════════════════════════════════════════
async function bootApp(){
  showScr('s-app');
  try{
    me=await client.getMe();
    const name=[me.firstName,me.lastName].filter(Boolean).join(' ')||me.username||'Me';
    $id('me-name').textContent=name;
    $id('me-phone').textContent=me.phone?'+'+me.phone:'';
    const av=$id('me-av');
    av.className='me-av '+avNum(me.id);
    av.textContent=initials(name);
  }catch(e){console.warn('getMe',e)}
  await loadDialogs();
  dlgPoll=setInterval(loadDialogs,12000);
}

// ══════════════════════════════════════════
//  DIALOGS
// ══════════════════════════════════════════
async function loadDialogs(){
  try{
    const dlist=await client.getDialogs({limit:60});
    dialogs=dlist;
    renderDialogs(dlist,$id('sch').value);
  }catch(e){
    console.error('dialogs',e);
  }
}

function entityName(e){
  if(!e)return 'Unknown';
  if(e.firstName||e.lastName)return [e.firstName,e.lastName].filter(Boolean).join(' ');
  if(e.title)return e.title;
  return 'Unknown';
}
function lastPreview(d){
  const m=d.message;
  if(!m)return '';
  if(m.message)return m.message;
  const c=m.media?.className||'';
  if(c.includes('Photo'))return '📷 Photo';
  if(c.includes('Document'))return '📎 File';
  if(c.includes('WebPage'))return '🔗 Link';
  if(c.includes('Video'))return '📹 Video';
  if(c.includes('Voice'))return '🎤 Voice';
  if(c.includes('Geo'))return '📍 Location';
  if(m.media)return '📎 Media';
  return '';
}

function renderDialogs(dlist,filter=''){
  const cl=$id('clist');
  const flt=filter?dlist.filter(d=>entityName(d.entity).toLowerCase().includes(filter.toLowerCase())):dlist;

  if(!flt.length){
    cl.innerHTML='<div style="padding:30px;text-align:center;color:var(--dim);font-size:14px">Koi chat nahi mili</div>';
    return;
  }

  cl.innerHTML=flt.map((d,ri)=>{
    const name=entityName(d.entity);
    const prev=lastPreview(d);
    const tid=d.message?.date;
    const time=tid?ts2time(tid):'';
    const unread=d.unreadCount||0;
    const eid=d.entity?.id||0;
    const avcls=avNum(eid);
    const ini=initials(name);
    const isOut=d.message?.out;
    const idx=dialogs.indexOf(d);

    return `<div class="ci" data-idx="${idx}" id="ci-${idx}">
      <div class="ci-av ${avcls}">${ini}</div>
      <div class="ci-info">
        <div class="ci-top">
          <span class="ci-name">${h(name)}</span>
          <span class="ci-time">${time}</span>
        </div>
        <div class="ci-bot">
          <span class="ci-prev">${isOut?'<span style="color:var(--accent2)">Tum: </span>':''}${h(prev)}</span>
          ${unread?`<span class="badge">${unread>99?'99+':unread}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  cl.querySelectorAll('.ci').forEach(el=>{
    el.addEventListener('click',()=>{
      const idx=parseInt(el.dataset.idx);
      openDialog(dialogs[idx],el);
    });
  });
}

$id('sch').addEventListener('input',e=>renderDialogs(dialogs,e.target.value));

// ══════════════════════════════════════════
//  OPEN DIALOG
// ══════════════════════════════════════════
async function openDialog(d,el){
  if(msgPoll)clearInterval(msgPoll);
  activeDialog=d;
  lastMsgId=0;

  document.querySelectorAll('.ci').forEach(x=>x.classList.remove('act'));
  if(el)el.classList.add('act');

  const name=entityName(d.entity);
  const eid=d.entity?.id||0;
  const avcls=avNum(eid);
  const ini=initials(name);

  $id('chdr-name').textContent=name;
  $id('chdr-status').textContent='';
  const cha=$id('chdr-av');
  cha.className='chdr-av '+avcls;
  cha.textContent=ini;

  $id('empty-state').style.display='none';
  const cv=$id('chat-view');
  cv.style.display='flex';
  cv.style.flexDirection='column';
  cv.style.height='100%';

  $id('msgs').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:center;flex:1;gap:10px;color:var(--muted);font-size:14px">
      <span class="spin" style="border-top-color:var(--accent)"></span> Messages aa rahi hain...
    </div>`;

  if(window.innerWidth<=720){
    $id('sidebar').classList.remove('open');
  }

  await fetchMessages(d);
  msgPoll=setInterval(()=>pollNew(d),2500);

  try{
    await client.invoke(new TG.Api.messages.ReadHistory({peer:d.entity,maxId:0}));
    if(el){
      const badge=el.querySelector('.badge');
      if(badge)badge.remove();
    }
  }catch{}
}

async function fetchMessages(d){
  try{
    const msgs=await client.getMessages(d.entity,{limit:60});
    const sorted=msgs.slice().reverse();
    renderMessages(sorted,d);
    lastMsgId=msgs.reduce((m,x)=>Math.max(m,x.id||0),0);
    scrollBottom();
  }catch(e){
    $id('msgs').innerHTML=`<div style="text-align:center;color:var(--danger);padding:20px;font-size:14px">Messages load fail: ${h(e.message)}</div>`;
  }
}

function renderMessages(msgs,d){
  const area=$id('msgs');
  if(!msgs.length){
    area.innerHTML='<div style="text-align:center;color:var(--dim);padding:30px;font-size:14px">Abhi koi message nahi</div>';
    return;
  }

  area.innerHTML='';
  let lastDate='';

  msgs.forEach((msg,i)=>{
    if(!msg||!msg.date)return;

    const dateStr=ts2date(msg.date);
    if(dateStr!==lastDate){
      lastDate=dateStr;
      const sep=document.createElement('div');
      sep.className='date-sep';
      sep.innerHTML=`<span>${dateStr}</span>`;
      area.appendChild(sep);
    }

    if(!msg.message&&!msg.media&&msg.action){
      const sv=document.createElement('div');
      sv.className='svc';
      sv.textContent='Service message';
      area.appendChild(sv);
      return;
    }

    const isOut=!!msg.out;
    const wrap=document.createElement('div');
    wrap.className='mw '+(isOut?'out':'in');

    const time=new Date(msg.date*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

    let inner='';

    if(!isOut){
      inner+=`<div class="m-av ${avNum(msg.fromId?.userId||d.entity?.id||0)}">${initials(entityName(d.entity))}</div>`;
    }

    let content='';
    if(msg.message){
      content=`<div class="mtxt">${h(msg.message).replace(/\n/g,'<br>')}</div>`;
    }
    if(msg.media){
      const mc=msg.media.className||'';
      if(mc.includes('Photo')){
        content+=`<div class="mtxt" style="color:var(--muted)">📷 Photo</div>`;
      }else if(mc.includes('Document')){
        content+=`<div class="mtxt">📎 File</div>`;
      }else if(mc.includes('WebPage')){
        content+=`<div class="mtxt">🔗 Link</div>`;
      }else if(mc.includes('Geo')){
        content+=`<div class="mtxt">📍 Location</div>`;
      }else if(!msg.message){
        content+=`<div class="mtxt" style="color:var(--muted)">📎 Media</div>`;
      }
    }

    const checkmark=isOut?`<span class="mcheck">✓✓</span>`:'';

    inner+=`<div class="mbub">
      ${content}
      <div class="mmeta">
        <span class="mtime">${time}</span>
        ${checkmark}
      </div>
    </div>`;

    wrap.innerHTML=inner;
    area.appendChild(wrap);
  });
}

function appendMsg(msg){
  const area=$id('msgs');
  const isOut=!!msg.out;
  const time=new Date(msg.date*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  const wrap=document.createElement('div');
  wrap.className='mw '+(isOut?'out':'in');

  let inner='';
  if(!isOut){
    inner+=`<div class="m-av ${avNum(msg.fromId?.userId||activeDialog?.entity?.id||0)}">${initials(entityName(activeDialog?.entity))}</div>`;
  }

  let content='';
  if(msg.message)content=`<div class="mtxt">${h(msg.message).replace(/\n/g,'<br>')}</div>`;
  else if(msg.media)content=`<div class="mtxt" style="color:var(--muted)">📎 Media</div>`;

  inner+=`<div class="mbub">
    ${content}
    <div class="mmeta">
      <span class="mtime">${time}</span>
      ${isOut?'<span class="mcheck">✓✓</span>':''}
    </div>
  </div>`;

  wrap.innerHTML=inner;
  area.appendChild(wrap);
}

async function pollNew(d){
  if(!d||!activeDialog)return;
  try{
    const msgs=await client.getMessages(d.entity,{limit:5,minId:lastMsgId});
    if(msgs.length){
      msgs.reverse().forEach(msg=>{
        if(msg.id>lastMsgId){ lastMsgId=msg.id; appendMsg(msg); }
      });
      scrollBottom();
    }
  }catch{}
}

function scrollBottom(){
  const a=$id('msgs');
  a.scrollTop=a.scrollHeight;
}

// ══════════════════════════════════════════
//  SEND
// ══════════════════════════════════════════
$id('sbtn').addEventListener('click',sendMsg);
$id('itxt').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
});
$id('itxt').addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,160)+'px';
});

async function sendMsg(){
  if(!activeDialog)return;
  const txt=$id('itxt').value.trim();
  if(!txt)return;
  $id('itxt').value='';
  $id('itxt').style.height='auto';

  const fakeMsg={
    out:true,date:Math.floor(Date.now()/1000),
    message:txt,id:Date.now()
  };
  appendMsg(fakeMsg);
  scrollBottom();

  try{
    const sent=await client.sendMessage(activeDialog.entity,{message:txt});
    lastMsgId=Math.max(lastMsgId,sent.id||0);
    setTimeout(loadDialogs,500);
  }catch(e){
    console.error("Send error:", e);
    toast('Send fail: '+e.message);
  }
}

// ══════════════════════════════════════════
//  CONTROLS
// ══════════════════════════════════════════
$id('logout-btn').addEventListener('click',async()=>{
  if(!confirm('Logout karna chahte ho?'))return;
  if(msgPoll)clearInterval(msgPoll);
  if(dlgPoll)clearInterval(dlgPoll);
  try{ await client.invoke(new TG.Api.auth.LogOut()); }catch{}
  clearSession();
  client=null; me=null; dialogs=[]; activeDialog=null;
  showScr('s-login'); showStep('st-phone');
  toast('Logout ho gaye ✓');
});

$id('refresh-chat').addEventListener('click',async()=>{
  if(!activeDialog)return;
  await fetchMessages(activeDialog);
  toast('Refresh ho gaya ✓');
});

$id('ham-btn').addEventListener('click',()=>{
  $id('sidebar').classList.toggle('open');
});

$id('back-mob').addEventListener('click',()=>{
  $id('sidebar').classList.add('open');
  $id('chat-view').style.display='none';
  $id('empty-state').style.display='flex';
});
</script>
